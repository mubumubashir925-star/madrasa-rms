name = "madrasa-rms"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Static frontend (public/) is served by Cloudflare; /api/* is handled by the Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "madrasa-rms"
database_id = "2a408277-8297-482d-9ba6-ec773b5feff7"

[vars]
ADMIN_USER = "admin"
# ADMIN_PASSWORD and JWT_SECRET are SECRETS -> set with `wrangler secret put` (never put them here)
