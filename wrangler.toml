name = "madrasa-rms"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Static frontend (public/) is served by Cloudflare; /api/* is handled by the Worker
[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs for pages and /api (so link previews get the institution name/logo), but the fixed files below are
# served straight from the static assets: they do NOT use your free daily Worker requests ("!" = skip the Worker).
run_worker_first = ["/*", "!/styles.css", "!/sw.js", "!/app.js", "!/app.css", "!/manifest.webmanifest", "!/icons/*"]

[[d1_databases]]
binding = "DB"
database_name = "madrasa-rms"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"

[vars]
ADMIN_USER = "admin"
# ADMIN_PASSWORD and JWT_SECRET are SECRETS -> set with `wrangler secret put` (never put them here)
